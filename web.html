<!DOCTYPE html>
<html>
<head><title>Registration Form</title></head>
<body>
  <h2>Registration Form</h2>
  <form>
    <label>Name: <input type="text" required minlength="3"></label><br><br>
    <label>Email: <input type="email" required></label><br><br>
    <label>Age: <input type="number" min="1" max="120" required></label><br><br>
    <label>DOB: <input type="date" required></label><br><br>
    <label>Password: <input type="password" minlength="6" required></label><br><br>
    <label>Phone: <input type="tel" pattern="[0-9]{10}" required></label><br><br>
    <label>Gender:
      <input type="radio" name="gender" value="male"> Male
      <input type="radio" name="gender" value="female"> Female
    </label><br><br>
    <label>Course:
      <select required>
        <option value="">Select</option>
        <option>BE CSE</option>
        <option>BE ECE</option>
      </select>
    </label><br><br>
    <button type="submit">Register</button>
  </form>
</body>
</html>
